# =============================================================================
#  KI Sensor Cockpit: sensor setup
# -----------------------------------------------------------------------------
#  Everything marked REPLACE is dummy data. At kickoff, swap in the sensors
#  Micro-Epsilon hands you. All values are displacement from a reference
#  position in micrometres (µm), so 0 means "exactly on target".
#
#  source.type decides where the numbers come from:
#    simulator   realistic dummy data (default, works anywhere)
#    replay      a CSV recorded with sensorTOOL (real data, no code needed)
#    medaqlib    live sensor through MEDAQLib (see app/sources/medaqlib.py)
# =============================================================================

cockpit:
  title: "KI Sensor Cockpit"
  team: "Team Name"                 # REPLACE: your team name, shown in the header
  assistant_name: "Epsilon"         # what the voice copilot calls itself
  language: "en"                    # en or de: language the copilot starts in

engine:
  analysis_rate_hz: 500             # samples per second used for analysis
  fast_buffer_s: 600                # full-rate history kept in memory (10 min)
  slow_buffer_s: 28800              # 1-second min/mean/max kept in memory (8 h, one shift)
  backfill_s: 900                   # simulator only: full-rate history created at start
  part_rpm: 8.6                     # REPLACE: how fast the measured part turns (0 if it does not)

sensors:
  - id: s1
    name: "Sensor 1"
    model: "optoNCDT 5500 (simulated)"  # REPLACE: real model from the sensor label
    unit: "µm"
    nominal: 0.0
    tolerance: { low: -40.0, high: 40.0 }   # REPLACE: your tolerance band
    fixture: "fixture-a"            # sensors on one fixture feel the same table tap
    source:
      type: simulator
      noise: 0.8                    # simulator: noise, 1 sigma in µm
      hum_hz: 12.5                  # simulator: small machine hum
      hum_amplitude: 0.15
      seed: 11
      # --- replay example (record with sensorTOOL, then uncomment) ---------
      # type: replay
      # path: data/sensor1_recording.csv
      # column: 1                   # column index or header name
      # file_rate_hz: 1000          # sample rate of the recording
      # scale: 1000.0               # mm -> µm
      # offset: 0.0                 # subtract a reference after scaling
    settings:                       # dummy settings the copilot may change
      averaging:
        value: 16
        min: 1
        max: 1024
        description: "Moving average over N measurements. Higher means less noise but slower response."
      measuring_rate_hz:
        value: 2000
        options: [250, 500, 1000, 2000, 4000, 8000]
        description: "Measurements per second."
      exposure_mode:
        value: "intelligent"
        options: ["standard", "intelligent", "background"]
        description: "How the sensor adapts to the surface. Placeholder values, replace with the real options."

  - id: s2
    name: "Sensor 2"
    model: "optoNCDT 5500 (simulated)"  # REPLACE
    unit: "µm"
    nominal: 0.0
    tolerance: { low: -40.0, high: 40.0 }   # REPLACE
    fixture: "fixture-a"
    source:
      type: simulator
      noise: 0.6
      hum_hz: 12.5
      hum_amplitude: 0.12
      seed: 23
    settings:
      averaging:
        value: 16
        min: 1
        max: 1024
        description: "Moving average over N measurements. Higher means less noise but slower response."
      measuring_rate_hz:
        value: 2000
        options: [250, 500, 1000, 2000, 4000, 8000]
        description: "Measurements per second."
      exposure_mode:
        value: "intelligent"
        options: ["standard", "intelligent", "background"]
        description: "How the sensor adapts to the surface. Placeholder values, replace with the real options."

# Alert thresholds. Tune these at the event with real table taps.
detection:
  eval_interval_s: 0.25             # how often the rules run
  baseline_s: 20                    # learn "normal" noise from this much data
  vibration_window_s: 1.0
  vibration_ratio: 4.0              # short-window spread vs normal noise
  vibration_min_hz: 12.0            # slower movements (runout, a dent once per turn) are not vibration
  vibration_min_prominence: 6.0     # how clearly one frequency must stand out
  noise_window_s: 4.0
  noise_ratio: 2.5                  # sustained noise vs normal noise
  noise_hold_s: 2.0
  drift_window_s: 30.0
  drift_min_rate_per_min: 3.0       # µm per minute that counts as drift
  drift_min_r2: 0.8                 # how straight the trend must be (0..1)
  drift_hold_s: 8.0                 # trend must hold this long before it is reported
  drift_critical_minutes: 5.0       # forecast below this becomes critical
  invalid_window_s: 1.0
  invalid_min_share: 0.2            # share of invalid readings that raises an alert
  out_of_range_window_s: 0.5
  rearm_s: 3.0                      # condition must clear this long before it can fire again
  cooldown_s:
    vibration: 10
    noise: 30
    drift: 60
    out_of_range: 30
    invalid: 20
